<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <div class="seal">Agent Access</div>
      <h1>Agent Registry</h1>

      <form id="agentForm" class="agent-form">
        <div class="field-row">
          <label for="agentName">Name</label>
          <input id="agentName" name="agentName" type="text" maxlength="24" placeholder="Enter your code name" required />
        </div>

        <div class="field-row">
          <label for="accessLevel">Clearance Level</label>
          <select id="accessLevel" name="accessLevel">
            <option value="Alpha">Alpha</option>
            <option value="Bravo">Bravo</option>
            <option value="Charlie">Charlie</option>
            <option value="Delta">Delta</option>
          </select>
        </div>

        <button type="submit" class="primary-btn">Proceed to Hand Scan</button>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
